prometheus:
  enabled: true
  prometheusSpec:
    retention: 4h
    retentionSize: "2GB"
    storageSpec: {}
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 800m, memory: 1Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: prometheus

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 768Mi }
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: prometheus

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage: {}
    resources:
      requests: { cpu: 30m,  memory: 48Mi }
      limits:   { cpu: 100m, memory: 96Mi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: prometheus

prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 30m,  memory: 96Mi }
    limits:   { cpu: 100m, memory: 192Mi }
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: prometheus

kube-state-metrics:
  enabled: true
  resources:
    requests: { cpu: 30m,  memory: 64Mi }
    limits:   { cpu: 100m, memory: 192Mi }
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: prometheus

nodeExporter:
  enabled: true
  resources:
    requests: { cpu: 30m,  memory: 48Mi }
    limits:   { cpu: 100m, memory: 96Mi }

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false