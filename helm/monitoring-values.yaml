prometheus:
  enabled: true
  prometheusSpec:
    retention: 6h
    retentionSize: "3GB"
    storageSpec: {}  

    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 800m, memory: 1Gi }

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 384Mi }

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage: {}    
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 200m, memory: 128Mi }
  config:
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'http://max-bot.default.svc.cluster.local:8080/webhook'
            send_resolved: true

prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }

nodeExporter:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }

kubeStateMetrics:
  enabled: true

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false