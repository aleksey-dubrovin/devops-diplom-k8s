# =============================================================================
# Service для приложения diplom-app
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: diplom-app
  namespace: default
  labels:
    app: diplom-app
spec:
  type: ClusterIP
  selector:
    app: diplom-app
  ports:
    - name: http
      port: 80
      targetPort: 80