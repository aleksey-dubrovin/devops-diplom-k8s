# =============================================================================
# Реестр Secret-объектов Kubernetes
# =============================================================================
secrets:
  # ---------------------------------------------------------------------------
  # Пароль администратора Grafana
  # ---------------------------------------------------------------------------
  - name: grafana-admin
    namespace: monitoring
    type: Opaque
    keys:
      - name: admin-user
        value: admin                  
      - name: admin-password
        fromEnv: GRAFANA_ADMIN_PASSWORD

  # ---------------------------------------------------------------------------
  # TLS-сертификат для Ingress
  # ---------------------------------------------------------------------------
  - name: wildcard-dubrovins-tls
    namespace: monitoring
    type: kubernetes.io/tls
    keys:
      - name: tls.crt
        fromEnv: WILDCARD_TLS_CRT
      - name: tls.key
        fromEnv: WILDCARD_TLS_KEY