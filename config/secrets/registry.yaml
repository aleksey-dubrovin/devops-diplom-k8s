# =============================================================================
# Реестр Secret-объектов Kubernetes
# =============================================================================
secrets:
  # ---------------------------------------------------------------------------
  # Пароль администратора Grafana
  # ---------------------------------------------------------------------------
  - name: grafana-admin
    namespace: monitoring
    type: Opaque
    keys:
      - name: admin-user
        value: admin
      - name: admin-password
        fromEnv: GRAFANA_ADMIN_PASSWORD

  # ---------------------------------------------------------------------------
  # TLS-сертификат для monitoring.dubrovins.ru (Grafana)
  # ---------------------------------------------------------------------------
  - name: wildcard-dubrovins-tls
    namespace: monitoring
    type: kubernetes.io/tls
    keys:
      - name: tls.crt
        fromEnv: WILDCARD_TLS_CRT
      - name: tls.key
        fromEnv: WILDCARD_TLS_KEY

  # ---------------------------------------------------------------------------
  # TLS-сертификат для app.dubrovins.ru (приложение)
  # То же имя, но в другом namespace.
  # ---------------------------------------------------------------------------
  - name: wildcard-dubrovins-tls
    namespace: default
    type: kubernetes.io/tls
    keys:
      - name: tls.crt
        fromEnv: WILDCARD_TLS_CRT
      - name: tls.key
        fromEnv: WILDCARD_TLS_KEY

  # ---------------------------------------------------------------------------
  # imagePullSecret для Yandex Container Registry в namespace default
  # ---------------------------------------------------------------------------
  - name: yc-registry
    namespace: default
    type: docker-registry
    server: cr.yandex
    username: json_key
    passwordFromEnv: YC_SA_KEY_JSON

  # ---------------------------------------------------------------------------
  # imagePullSecret для Yandex Container Registry в namespace monitoring
  # ---------------------------------------------------------------------------
  - name: yc-registry
    namespace: monitoring
    type: docker-registry
    server: cr.yandex
    username: json_key
    passwordFromEnv: YC_SA_KEY_JSON

  # ---------------------------------------------------------------------------
  # Registry URL и имена образов приложений
  # ---------------------------------------------------------------------------
  - name: app-registry
    namespace: default
    type: Opaque
    keys:
      - name: registry-url
        fromEnv: REGISTRY_URL
      - name: diplom-app-image-name
        value: devops-diplom-app
      - name: max-bot-image-name
        value: max-bot

  # ---------------------------------------------------------------------------
  # Токены для MAX Bot
  # ---------------------------------------------------------------------------
  - name: max-bot-secret
    namespace: monitoring
    type: Opaque
    keys:
      - name: max-bot-token
        fromEnv: MAX_BOT_TOKEN
      - name: max-chat-id
        fromEnv: MAX_CHAT_ID