# =============================================================================
# Реестр Secret-объектов Kubernetes
# =============================================================================
secrets:
  # ---------------------------------------------------------------------------
  # Пароль администратора Grafana
  # ---------------------------------------------------------------------------
  - name: grafana-admin
    namespace: monitoring
    type: Opaque
    keys:
      - name: admin-user
        value: admin
      - name: admin-password
        fromEnv: GRAFANA_ADMIN_PASSWORD

  # ---------------------------------------------------------------------------
  # TLS-сертификат для Ingress
  # ---------------------------------------------------------------------------
  - name: wildcard-dubrovins-tls
    namespace: monitoring
    type: kubernetes.io/tls
    keys:
      - name: tls.crt
        fromEnv: WILDCARD_TLS_CRT
      - name: tls.key
        fromEnv: WILDCARD_TLS_KEY
  
  - name: wildcard-dubrovins-tls
    namespace: default
    type: kubernetes.io/tls
    keys:
      - name: tls.crt
        fromEnv: WILDCARD_TLS_CRT
      - name: tls.key
        fromEnv: WILDCARD_TLS_KEY
  # ---------------------------------------------------------------------------
  # Деплой приложения из devops-diplom-app
  # ---------------------------------------------------------------------------
  - name: app-registry
    namespace: default
    type: Opaque
    keys:
      - name: registry-url
        fromEnv: REGISTRY_URL
      - name: image-name
        value: devops-diplom-app

  - name: yc-registry
    namespace: default
    type: docker-registry
    server: cr.yandex
    username: json_key
    passwordFromEnv: YC_SA_KEY_JSON