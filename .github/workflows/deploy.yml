# =============================================================================
# Deploy: рендер манифестов через envsubst и применение в кластер
# =============================================================================
name: Deploy App

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия образа diplom-app (например, v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache YC CLI
        id: cache-yc
        uses: actions/cache@v4
        with:
          path: ~/yandex-cloud
          key: ${{ runner.os }}-yc-cli-v1
          restore-keys: ${{ runner.os }}-yc-cli-

      - name: Install YC CLI
        if: steps.cache-yc.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | \
            bash -s -- -i $HOME/yandex-cloud -n

      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Cache kubectl
        id: cache-kubectl
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/kubectl
          key: ${{ runner.os }}-kubectl-v1.31.0
          restore-keys: ${{ runner.os }}-kubectl-

      - name: Install kubectl
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL -o ~/.local/bin/kubectl \
            "https://storage.googleapis.com/kubernetes-release/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x ~/.local/bin/kubectl

      - name: Add kubectl to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Write Service Account Key
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}' | base64 -d > ${{ github.workspace }}/sa-key.json
          chmod 600 ${{ github.workspace }}/sa-key.json

      - name: Configure YC CLI
        run: |
          yc config profile create ci-profile
          yc config set service-account-key ${{ github.workspace }}/sa-key.json
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config profile activate ci-profile

      - name: Get Kubeconfig
        run: |
          CLUSTER_ID=$(yc managed-kubernetes cluster list --format json | jq -r '.[0].id')
          yc managed-kubernetes cluster get-credentials --id "$CLUSTER_ID" --external --force
          kubectl cluster-info

      # ======================================================================
      # Проверка Secret app-registry
      # ======================================================================
      - name: Ensure app-registry secret exists
        run: |
          if ! kubectl -n default get secret app-registry &>/dev/null; then
            echo "Secret app-registry не найден, создаём"
            kubectl -n default create secret generic app-registry \
              --from-literal=registry-url="${{ secrets.REGISTRY_URL }}" \
              --from-literal=diplom-app-image-name="devops-diplom-app" \
              --from-literal=max-bot-image-name="max-bot"
          else
            echo "Secret app-registry уже существует"
          fi

      - name: Read registry info
        id: registry
        run: |
          REGISTRY_URL=$(kubectl -n default get secret app-registry \
            -o jsonpath='{.data.registry-url}' | base64 -d)
          DIPLOM_APP_IMAGE_NAME=$(kubectl -n default get secret app-registry \
            -o jsonpath='{.data.diplom-app-image-name}' | base64 -d)
          MAX_BOT_IMAGE_NAME=$(kubectl -n default get secret app-registry \
            -o jsonpath='{.data.max-bot-image-name}' | base64 -d)

          if [ -z "$REGISTRY_URL" ] || [ -z "$DIPLOM_APP_IMAGE_NAME" ] || [ -z "$MAX_BOT_IMAGE_NAME" ]; then
            echo "ОШИБКА: Secret app-registry не содержит нужных ключей"
            exit 1
          fi

          echo "registry_url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          echo "diplom_app_image_name=$DIPLOM_APP_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "max_bot_image_name=$MAX_BOT_IMAGE_NAME" >> $GITHUB_OUTPUT

          echo "REGISTRY_URL:          $REGISTRY_URL"
          echo "DIPLOM_APP_IMAGE_NAME: $DIPLOM_APP_IMAGE_NAME"
          echo "MAX_BOT_IMAGE_NAME:    $MAX_BOT_IMAGE_NAME"

      # ======================================================================
      # Рендер всех манифестов из config/app/
      # ======================================================================
      - name: Render manifests
        run: |
          set -euo pipefail

          export REGISTRY_URL="${{ steps.registry.outputs.registry_url }}"
          export DIPLOM_APP_IMAGE_NAME="${{ steps.registry.outputs.diplom_app_image_name }}"
          export MAX_BOT_IMAGE_NAME="${{ steps.registry.outputs.max_bot_image_name }}"
          export IMAGE_TAG="${{ env.VERSION }}"

          echo "Параметры рендера:"
          echo "  REGISTRY_URL          = $REGISTRY_URL"
          echo "  DIPLOM_APP_IMAGE_NAME = $DIPLOM_APP_IMAGE_NAME"
          echo "  MAX_BOT_IMAGE_NAME    = $MAX_BOT_IMAGE_NAME"
          echo "  IMAGE_TAG             = $IMAGE_TAG"

          rm -rf /tmp/rendered
          mkdir -p /tmp/rendered

          for FILE in config/app/*.yaml; do
            OUT="/tmp/rendered/$(basename "$FILE")"
            envsubst < "$FILE" > "$OUT"
            echo "Rendered: $OUT"
          done

          echo ""
          echo "Проверка строк image:"
          grep "image:" /tmp/rendered/*.yaml || true

      # ======================================================================
      # Применение в кластер
      # ======================================================================
      - name: Apply deployments
        run: |
          kubectl apply -f /tmp/rendered/

      - name: Wait for diplom-app rollout
        run: |
          kubectl -n default rollout status deployment/diplom-app --timeout=3m

      - name: Wait for max-bot rollout
        run: |
          kubectl -n monitoring rollout status deployment/max-bot --timeout=3m || true

      # ======================================================================
      # Итоговое состояние
      # ======================================================================
      - name: Show final state
        if: always()
        run: |
          echo "Deployments (default):"
          kubectl -n default get deploy || true
          echo ""
          echo "Deployments (monitoring):"
          kubectl -n monitoring get deploy | grep -vE 'prometheus|grafana|kube' || true
          echo ""
          echo "Поды diplom-app:"
          kubectl -n default get pods -l app=diplom-app || true
          echo ""
          echo "Поды max-bot:"
          kubectl -n monitoring get pods -l app=max-bot || true