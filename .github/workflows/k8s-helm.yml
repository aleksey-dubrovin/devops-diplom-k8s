# =============================================================================
# Workflow для установки Helm-чартов
# =============================================================================
name: K8s Helm

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/k8s-helm.yml'
  workflow_dispatch:

jobs:
  helm:
    name: helm upgrade --install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Кэширование
      # ----------------------------------------------------------------------
      - name: Cache YC CLI
        id: cache-yc
        uses: actions/cache@v4
        with:
          path: ~/yandex-cloud
          key: ${{ runner.os }}-yc-cli-v1
          restore-keys: ${{ runner.os }}-yc-cli-

      - name: Install YC CLI
        if: steps.cache-yc.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | \
            bash -s -- -i $HOME/yandex-cloud -n

      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Cache kubectl
        id: cache-kubectl
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/kubectl
          key: ${{ runner.os }}-kubectl-v1.31.0
          restore-keys: ${{ runner.os }}-kubectl-

      - name: Install kubectl
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL -o ~/.local/bin/kubectl \
            "https://storage.googleapis.com/kubernetes-release/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x ~/.local/bin/kubectl

      - name: Add kubectl to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Cache Helm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/helm
            ~/.config/helm
          key: ${{ runner.os }}-helm-${{ hashFiles('helm/**') }}
          restore-keys: ${{ runner.os }}-helm-

      # ----------------------------------------------------------------------
      # Секреты и kubeconfig
      # ----------------------------------------------------------------------
      - name: Write Service Account Key
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}' | base64 -d > ${{ github.workspace }}/sa-key.json
          chmod 600 ${{ github.workspace }}/sa-key.json

      - name: Configure YC CLI
        run: |
          yc config profile create ci-profile
          yc config set service-account-key ${{ github.workspace }}/sa-key.json
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config profile activate ci-profile

      - name: Get Kubeconfig
        run: |
          CLUSTER_ID=$(yc managed-kubernetes cluster list --format json | jq -r '.[0].id')
          yc managed-kubernetes cluster get-credentials --id "$CLUSTER_ID" --external --force
          kubectl cluster-info

      # ----------------------------------------------------------------------
      # Установка Ingress NGINX
      # ----------------------------------------------------------------------
      - name: Install Ingress NGINX
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx --create-namespace \
            -f helm/ingress-nginx-values.yaml \
            --wait --timeout 10m

      - name: Wait for LoadBalancer IP
        run: |
          echo "Ожидание внешнего IP LoadBalancer (до 5 минут)..."
          for i in $(seq 1 30); do
            IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
                 -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [ -n "$IP" ]; then
              echo "=== Ingress Controller доступен по IP: $IP ==="
              exit 0
            fi
            echo "Попытка $i/30: IP пока не назначен"
            sleep 10
          done
          echo "Таймаут ожидания IP."
          kubectl get svc -n ingress-nginx
          exit 1

      - name: Show Final State
        if: always()
        run: |
          echo "=== Поды ingress-nginx ==="
          kubectl get pods -n ingress-nginx -o wide || true
          echo ""
          echo "=== Сервисы ingress-nginx ==="
          kubectl get svc -n ingress-nginx || true
          echo ""
          echo "=== IngressClass ==="
          kubectl get ingressclass || true