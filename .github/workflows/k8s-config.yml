# =============================================================================
# Workflow для применения внутренних ресурсов кластера
# =============================================================================
name: K8s Config

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/secrets/**'
      - 'config/service/**'
      - 'config/ingress/**'
      - 'monitoring/**'
      - '.github/workflows/k8s-config.yml'
  push:
    branches: [main]
    paths:
      - 'config/secrets/**'
      - 'config/service/**'
      - 'config/ingress/**'
      - 'monitoring/**'
      - '.github/workflows/k8s-config.yml'
  workflow_dispatch:

jobs:
  apply:
    name: ${{ github.event_name == 'pull_request' && 'Diff (dry-run)' || 'Apply manifests' }}
    runs-on: ubuntu-latest

    env:
      SECRET_GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      SECRET_WILDCARD_TLS_CRT:       ${{ secrets.WILDCARD_TLS_CRT }}
      SECRET_WILDCARD_TLS_KEY:       ${{ secrets.WILDCARD_TLS_KEY }}
      SECRET_REGISTRY_URL:           ${{ secrets.REGISTRY_URL }}
      SECRET_YC_SA_KEY_JSON:         ${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}
      SECRET_MAX_BOT_TOKEN:          ${{ secrets.MAX_BOT_TOKEN }}
      SECRET_MAX_CHAT_ID:            ${{ secrets.MAX_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache YC CLI
        id: cache-yc
        uses: actions/cache@v4
        with:
          path: ~/yandex-cloud
          key: ${{ runner.os }}-yc-cli-v1
          restore-keys: ${{ runner.os }}-yc-cli-

      - name: Install YC CLI
        if: steps.cache-yc.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | \
            bash -s -- -i $HOME/yandex-cloud -n

      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Cache kubectl
        id: cache-kubectl
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/kubectl
          key: ${{ runner.os }}-kubectl-v1.31.0
          restore-keys: ${{ runner.os }}-kubectl-

      - name: Install kubectl
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL -o ~/.local/bin/kubectl \
            "https://storage.googleapis.com/kubernetes-release/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x ~/.local/bin/kubectl

      - name: Add kubectl to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Write Service Account Key
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}' | base64 -d > ${{ github.workspace }}/sa-key.json
          chmod 600 ${{ github.workspace }}/sa-key.json

      - name: Configure YC CLI
        run: |
          yc config profile create ci-profile
          yc config set service-account-key ${{ github.workspace }}/sa-key.json
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config profile activate ci-profile

      - name: Get Kubeconfig
        run: |
          CLUSTER_ID=$(yc managed-kubernetes cluster list --format json | jq -r '.[0].id')
          yc managed-kubernetes cluster get-credentials --id "$CLUSTER_ID" --external --force
          kubectl cluster-info

      # ======================================================================
      # Создание Secret'ов из реестра
      # ======================================================================
      - name: Create Secrets from Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          REGISTRY=config/secrets/registry.yaml
          if [ ! -f "$REGISTRY" ]; then
            echo "Реестр не найден, пропускаем"
            exit 0
          fi

          yq -o=json -I=0 '.secrets[]' "$REGISTRY" > /tmp/secrets.jsonl 2>/dev/null || true
          if [ ! -s /tmp/secrets.jsonl ]; then
            echo "Секретов нет, пропускаем"
            exit 0
          fi

          CREATED=0
          SKIPPED=0

          while read -r SECRET; do
            [ -z "$SECRET" ] && continue
            NAME=$(echo "$SECRET" | jq -r '.name')
            NS=$(echo "$SECRET" | jq -r '.namespace')
            TYPE=$(echo "$SECRET" | jq -r '.type // "Opaque"')

            echo ""
            echo "Secret: $NAME (namespace: $NS, type: $TYPE)"

            if ! kubectl get ns "$NS" &>/dev/null; then
              echo "  namespace '$NS' не найден, пропуск"
              SKIPPED=$((SKIPPED+1))
              continue
            fi

            if [ "$TYPE" = "docker-registry" ]; then
              SERVER=$(echo "$SECRET" | jq -r '.server')
              USERNAME=$(echo "$SECRET" | jq -r '.username')
              PASSWORD_FROM_ENV=$(echo "$SECRET" | jq -r '.passwordFromEnv // empty')

              if [ -z "$SERVER" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD_FROM_ENV" ]; then
                echo "  не заданы server, username или passwordFromEnv, пропуск"
                SKIPPED=$((SKIPPED+1))
                continue
              fi

              VAR_NAME="SECRET_${PASSWORD_FROM_ENV}"
              PASSWORD_B64="${!VAR_NAME:-}"
              if [ -z "$PASSWORD_B64" ]; then
                echo "  env $VAR_NAME пуст, пропуск"
                SKIPPED=$((SKIPPED+1))
                continue
              fi

              echo "$PASSWORD_B64" | base64 -d > /tmp/registry-password.json

              kubectl create secret docker-registry "$NAME" \
                -n "$NS" \
                --docker-server="$SERVER" \
                --docker-username="$USERNAME" \
                --docker-password="$(cat /tmp/registry-password.json)" \
                --dry-run=client -o yaml | kubectl apply -f -

              rm -f /tmp/registry-password.json

              echo "  создан как docker-registry"
              CREATED=$((CREATED+1))
              continue
            fi

            ARGS=()
            while read -r KEY; do
              [ -z "$KEY" ] && continue
              KEY_NAME=$(echo "$KEY" | jq -r '.name')
              FROM_ENV=$(echo "$KEY" | jq -r '.fromEnv // empty')
              LITERAL=$(echo "$KEY" | jq -r '.value // empty')

              if [ -n "$FROM_ENV" ]; then
                VAR_NAME="SECRET_${FROM_ENV}"
                VALUE="${!VAR_NAME:-}"
                if [ -z "$VALUE" ]; then
                  echo "  переменная $VAR_NAME пуста, ключ '$KEY_NAME' пропущен"
                  continue
                fi
                ARGS+=("--from-literal=${KEY_NAME}=${VALUE}")
                echo "  ключ $KEY_NAME взят из env:$VAR_NAME"
              elif [ -n "$LITERAL" ]; then
                ARGS+=("--from-literal=${KEY_NAME}=${LITERAL}")
                echo "  ключ $KEY_NAME задан литералом"
              fi
            done < <(echo "$SECRET" | jq -c '.keys[]')

            if [ ${#ARGS[@]} -eq 0 ]; then
              echo "  нет значений, Secret не создаётся"
              SKIPPED=$((SKIPPED+1))
              continue
            fi

            kubectl create secret generic "$NAME" \
              -n "$NS" --type="$TYPE" \
              "${ARGS[@]}" \
              --dry-run=client -o yaml | kubectl apply -f -
            CREATED=$((CREATED+1))
          done < /tmp/secrets.jsonl

          echo ""
          echo "Итог: создано $CREATED, пропущено $SKIPPED"

      # ======================================================================
      # Secret alertmanager-config из monitoring/alertmanager.yaml
      # ======================================================================
      # Файл monitoring/alertmanager.yaml не является Kubernetes-манифестом,
      # поэтому применяется не через kubectl apply, а через создание Secret
      # под ключом alertmanager.yaml (этого требует Prometheus Operator).
      # ======================================================================
      - name: Create Alertmanager Config Secret
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          SRC=monitoring/alertmanager.yaml
          if [ ! -f "$SRC" ]; then
            echo "Файл $SRC не найден, пропуск"
            exit 0
          fi

          kubectl -n monitoring create secret generic alertmanager-config \
            --from-file=alertmanager.yaml="$SRC" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Secret alertmanager-config создан или обновлён из $SRC"

      - name: Restart Grafana on Secret Update
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if kubectl get secret grafana-admin -n monitoring &>/dev/null; then
            kubectl rollout restart deployment prometheus-grafana -n monitoring
            kubectl rollout status deployment prometheus-grafana -n monitoring --timeout=2m
          fi

      # ======================================================================
      # PR: diff и dry-run
      # ======================================================================
      - name: Diff Manifests (PR)
        if: github.event_name == 'pull_request'
        run: |
          for DIR in config/service config/ingress; do
            if [ -d "$DIR" ] && ls "$DIR"/*.yaml &>/dev/null; then
              echo "kubectl diff $DIR"
              kubectl diff -f "$DIR/" -R || true
              echo ""
            fi
          done

          echo "kubectl apply --dry-run=server"
          for DIR in config/service config/ingress; do
            if [ -d "$DIR" ] && ls "$DIR"/*.yaml &>/dev/null; then
              kubectl apply --dry-run=server -f "$DIR/" -R
            fi
          done

      # ======================================================================
      # Main: apply
      # ======================================================================
      - name: Apply Manifests (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for DIR in config/service config/ingress; do
            if [ -d "$DIR" ] && ls "$DIR"/*.yaml &>/dev/null; then
              echo "Применяем $DIR"
              kubectl apply -f "$DIR/" -R
            else
              echo "$DIR пуст, пропуск"
            fi
          done

      # ======================================================================
      # Итоговое состояние
      # ======================================================================
      - name: Show Final State
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Secrets:"
          kubectl get secrets -A | grep -vE 'kube-|helm|default-token' || true
          echo ""
          echo "Services:"
          kubectl get svc -A | grep -vE 'kube-|ingress-nginx|monitoring' || true
          echo ""
          echo "Ingress:"
          kubectl get ingress -A || true
          echo ""
          echo "Deployments:"
          kubectl get deploy -A | grep -vE 'kube-|ingress-nginx|monitoring' || true