# =============================================================================
# Тестовое правило алертов (PrometheusRule)
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-alerts
  namespace: monitoring
  labels:
    release: prometheus
    app.kubernetes.io/instance: prometheus
spec:
  groups:
    - name: test
      interval: 30s
      rules:
        - alert: TestWarningAlert
          expr: vector(1) == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Тестовый WARNING алерт"
            description: "Проверка доставки уведомлений в MAX Bot"