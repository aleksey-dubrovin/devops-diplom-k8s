# =============================================================================
# Конфигурация Alertmanager
# =============================================================================
global:
  resolve_timeout: 5m

route:
  receiver: 'max-bot'
  group_by: ['alertname', 'namespace', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'max-bot'
    webhook_configs:
      - url: 'http://max-bot.monitoring.svc.cluster.local:8080/webhook'
        send_resolved: true